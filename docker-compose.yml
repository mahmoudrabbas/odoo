services:
    web:
        image: odoo:19
        depends_on:
            - db

        ports:
            - '8069:8069'

        environment:
            - HOST=db
            - USER=odoo
            - PASSWORD=odoo

        command: >
            odoo
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

        volumes:
            - ./custom-addons:/mnt/extra-addons

    db:
        image: postgres:15

        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_USER=odoo
            - POSTGRES_PASSWORD=odoo

        volumes:
            - odoo-db-data:/var/lib/postgresql/data

volumes:
    odoo-db-data:
